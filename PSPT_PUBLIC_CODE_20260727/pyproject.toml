[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pspt"
version = "1.0.0"
description = "Patch-Efficient Slide-Aware Prompt Tuning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "timm==0.9.8",
    "kornia>=0.7",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "opencv-python>=4.8",
    "scikit-learn>=1.2",
    "h5py>=3.9",
    "openslide-python>=1.3",
    "Pillow>=10",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["pspt*"]

[project.optional-dependencies]
dev = ["pytest>=7"]
